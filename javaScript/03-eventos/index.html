<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Práctica 3 - Eventos</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>

<section class="container"> 
  <h1>Formulario de Contacto</h1>

  <form id="formulario" novalidate>
    <div class="form-group">
      <label>Nombre completo *</label>
      <input type="text" id="nombre">
      <p class="error-msg" id="error-nombre">Mínimo 3 caracteres</p>
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input type="email" id="email">
      <p class="error-msg" id="error-email">Email inválido</p>
    </div>

    <div class="form-group">
      <label>Asunto *</label>
      <select id="asunto">
        <option value="">Selecciona</option>
        <option value="consulta">Consulta</option>
        <option value="soporte">Soporte</option>
      </select>
      <p class="error-msg" id="error-asunto">Selecciona uno</p>
    </div>

    <div class="form-group">
      <label>Mensaje *</label>
      <textarea id="mensaje" maxlength="300"></textarea>
      <p><span id="chars">0</span>/300</p>
      <p class="error-msg" id="error-mensaje">Mínimo 10 caracteres</p>
    </div>

    <button type="submit">Enviar</button>
  </form>

  <div id="resultado"></div>
</section>

<section class="container">
  <h2>Mis Tareas</h2>

  <input type="text" id="nueva-tarea">
  <button id="btn-agregar">Agregar</button>

  <ul id="lista-tareas"></ul>
  <p id="contador-tareas"></p>
</section>

</body>
</html>
